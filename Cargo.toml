[package]
name = "aerin-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aerin_app = { path = "crates/aerin_app" }
aerin_ecs = { path = "crates/aerin_ecs" }
aerin_input = { path = "crates/aerin_input" }
aerin_math = { path = "crates/aerin_math" }
aerin_renderer = { path = "crates/aerin_renderer" }
aerin_window = { path = "crates/aerin_window" }

[dev-dependencies]
glam = { version = "0.33" }
approx = { version = "0.5" }
criterion = { version = "0.8", features = ["html_reports"] }

[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
glow = "0.17"
glutin = "0.32"
wgpu = "30.0"
bytemuck = "1.25"
